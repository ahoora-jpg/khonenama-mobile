name: Build Khonenama Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck
      - name: Test photo uploads
        run: node --test scripts/test-media.mjs scripts/test-api-security.mjs
      - name: Lint
        run: npm run lint

      - name: Expo doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/khonenama-production.jks
          node scripts/configure-android-signing.mjs

      - name: Build standalone release APK
        working-directory: android
        env:
          KHONENAMA_STORE_FILE: khonenama-production.jks
          KHONENAMA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KHONENAMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KHONENAMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Prepare release file
        run: cp android/app/build/outputs/apk/release/app-release.apk khonenama-production.apk

      - name: Verify production signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs khonenama-production.apk | tee signature.txt
          grep -qi '451f3fe27480d2e5ea49035e43343c03380a1aa302f2e9d9ce5017e3f3ffee8d' signature.txt

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-${{ github.run_number }}" khonenama-production.apk \
            --title "Khonenama Android ${{ github.run_number }}" \
            --notes "Production-signed standalone APK for ir.khonenama.app. Certificate SHA-256: 45:1F:3F:E2:74:80:D2:E5:EA:49:03:5E:43:34:3C:03:38:0A:1A:A3:02:F2:E9:D9:CE:50:17:E3:F3:FF:EE:8D"
