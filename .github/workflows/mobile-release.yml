name: Build Khonenama Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Prepare release file
        run: cp android/app/build/outputs/apk/release/app-release.apk khonenama.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-${{ github.run_number }}" khonenama.apk \
            --title "Khonenama Android ${{ github.run_number }}" \
            --notes "Standalone release APK. This test build uses the generated debug signing configuration; create a protected production keystore before store distribution."
